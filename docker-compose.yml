services:
  db:
    image: postgres:17-alpine
    container_name: nextore-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - nextore_db_data:/var/lib/postgresql/data

volumes:
  nextore_db_data:
