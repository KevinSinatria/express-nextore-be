          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nomor invoice."
      responses:
        "200":
          description: "Daftar transaksi berhasil diambil."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
