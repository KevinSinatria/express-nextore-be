                          $ref: "#/components/schemas/Transaction"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
    post:
      tags:
        - Transactions
      summary: "Tambah transaksi baru"
      operationId: createTransaction
      description: "Membuat transaksi penjualan baru dengan daftar item produk dan metode pembayaran."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod, items]
