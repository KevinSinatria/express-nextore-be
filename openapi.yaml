    get:
      tags:
        - Discounts
      summary: "Ambil semua diskon"
      operationId: getAllDiscounts
      description: "Mengambil daftar semua program diskon dengan filter status aktif dan pencarian nama."
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah data per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama diskon."
        - in: query
          name: isActive
          schema:
            type: boolean
          description: "Filter berdasarkan status aktif."
      responses:
        "200":
          description: "Daftar diskon berhasil diambil."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Discount"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
    post:
      tags:
        - Discounts
      summary: "Tambah diskon baru"
      operationId: createDiscount
      description: "Membuat program diskon baru untuk produk tertentu atau level transaksi."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, endDate]
              properties:
                name:
                  type: string
                  description: "Nama program diskon."
                  example: "Promo Akhir Tahun"
                description:
                  type: string
                  description: "Deskripsi detail mengenai diskon."
                  example: "Diskon cuci gudang akhir tahun."
                type:
                  type: string
                  enum: [PERCENTAGE, FIXED_AMOUNT]
                  description: "Tipe diskon (persentase atau nominal tetap)."
                  example: "PERCENTAGE"
                value:
                  type: number
                  description: "Nilai diskon."
                  example: 15
                startDate:
                  type: string
                  format: date-time
                  description: "Waktu mulai diskon."
                  example: "2023-12-01T00:00:00Z"
                endDate:
                  type: string
                  format: date-time
                  description: "Waktu berakhir diskon."
                  example: "2023-12-31T23:59:59Z"
                isActive:
                  type: boolean
                  default: true
                  description: "Status keaktifan diskon."
                isTransactionLevel:
                  type: boolean
                  default: false
                  description: "Apakah berlaku untuk seluruh transaksi."
                productIds:
                  type: array
                  items:
                    type: string
                    format: cuid
                  description: "Daftar ID produk yang mendapatkan diskon (format CUID)."
                  example: ["prod123", "prod456"]
      responses:
        "201":
          description: "Diskon berhasil dibuat."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Discount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

