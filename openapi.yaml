  /users:
    get:
      tags:
        - Users
      summary: Ambil semua user (Admin)
      operationId: getAllUsers
      description: Mengambil daftar semua user/staf sistem. Hanya dapat diakses oleh Admin.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: string
          description: "Jumlah item per halaman."
        - in: query
          name: page
          schema:
            type: string
          description: "Nomor halaman."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama atau username."
      responses:
        "200":
          description: Daftar user berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Users
      summary: Buat user baru (Admin)
      operationId: createUser
      description: Membuat akun user/staf baru dalam sistem. Hanya Admin yang dapat melakukan ini.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: "Andi Wijaya"
                username:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: "^[a-zA-Z0-9_]{1,20}$"
                  example: "andi_cashier"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Password123"
                role:
                  type: string
                  enum: [ADMIN, SUPERVISOR, CASHIER]
                  default: CASHIER
                  example: "CASHIER"
      responses:
        "201":
          description: User berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

