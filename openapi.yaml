  /discounts:
    get:
      tags:
        - Discounts
      summary: Ambil semua diskon
      operationId: getAllDiscounts
      description: Mengambil daftar semua program diskon dengan filter status aktif dan pencarian.
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah item per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama diskon."
        - in: query
          name: isActive
          schema:
            type: boolean
          description: "Filter berdasarkan status aktif (true/false)."
      responses:
        "200":
          description: Daftar diskon berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Discount"
    post:
      tags:
        - Discounts
      summary: Buat diskon baru
      operationId: createDiscount
      description: Membuat program diskon baru, baik untuk level produk maupun transaksi.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, endDate]
              properties:
                name:
                  type: string
                  example: "Promo Akhir Tahun"
                description:
                  type: string
                  example: "Diskon cuci gudang akhir tahun 2023."
                type:
                  type: string
                  enum: [PERCENTAGE, FIXED_AMOUNT]
                  example: "PERCENTAGE"
                value:
                  type: number
                  example: 15
                startDate:
                  type: string
                  format: date-time
                  example: "2023-12-01T00:00:00Z"
                endDate:
                  type: string
                  format: date-time
                  example: "2023-12-31T23:59:59Z"
                isActive:
                  type: boolean
                  default: true
                isTransactionLevel:
                  type: boolean
                  default: false
                productIds:
                  type: array
                  items:
                    type: string
                  example: ["prod123", "prod456"]
                  description: "Daftar ID produk jika diskon level produk (opsional)."
      responses:
        "201":
          description: Diskon berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

