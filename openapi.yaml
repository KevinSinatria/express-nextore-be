openapi: 3.0.0
info:
  title: Nextore API
  description: API Documentation for Nextore Backend
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://nextore.nexvibe.biz.id
    description: Production server

tags:
  - name: Auth
    description: Authentication endpoints provided by better-auth
  - name: Products
    description: Product management endpoints
  - name: Categories
    description: Category management endpoints
  - name: Transactions
    description: Transaction management endpoints
  - name: Discounts
    description: Discount management endpoints
  - name: Members
    description: Member management endpoints
  - name: Users
    description: User management endpoints (Admin only)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session-token
  schemas:
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: "Menunjukkan apakah operasi berhasil (true) atau tidak (false)."
        message:
          type: string
          example: "Operasi berhasil dilakukan"
          description: "Pesan deskriptif mengenai hasil operasi."

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
          description: "Menunjukkan bahwa permintaan gagal."
        message:
          type: string
          example: "Pesan kesalahan yang menjelaskan apa yang salah"
          description: "Pesan deskriptif tentang kesalahan yang terjadi."

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Input tidak valid"
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string

    Product:
      type: object
      required: [id, sku, name, hpp, price, stock, categoryId]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik produk dalam format CUID (Collision-resistant Unique Identifier)."
          example: "clj1234567890abcdefg"
        sku:
          type: string
          minLength: 3
          maxLength: 100
          description: "Stock Keeping Unit, kode unik pengenal produk."
          example: "PROD-001"
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: "Nama produk."
          example: "Kopi Susu Gula Aren"
        images:
          type: array
          items:
            type: string
            format: uri
          description: "Daftar URL gambar produk."
          example: ["https://example.com/image.jpg"]
        hpp:
          type: number
          description: "Harga Pokok Penjualan (modal)."
          example: 15000
        price:
          type: number
          description: "Harga jual produk."
          example: 25000
        stock:
          type: integer
          description: "Jumlah stok yang tersedia."
          example: 50
        lowStockThreshold:
          type: integer
          description: "Ambang batas stok rendah untuk peringatan."
          example: 10
        categoryId:
          type: string
          format: cuid
          description: "ID kategori produk dalam format CUID."
          example: "cat123456789"
        createdAt:
          type: string
          format: date-time
          description: "Waktu produk dibuat."
        updatedAt:
          type: string
          format: date-time
          description: "Waktu produk terakhir diperbarui."

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik kategori dalam format CUID."
          example: "cat123456789"
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: "Nama kategori."
          example: "Minuman"
        createdAt:
          type: string
          format: date-time
          description: "Waktu kategori dibuat."
        updatedAt:
          type: string
          format: date-time
          description: "Waktu kategori terakhir diperbarui."

    Transaction:
      type: object
      required:
        [
          id,
          invoiceNumber,
          totalGross,
          totalDiscount,
          totalNet,
          totalProfit,
          paymentMethod,
          status,
          userId,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik transaksi dalam format CUID."
          example: "tx123456789"
        invoiceNumber:
          type: string
          description: "Nomor invoice unik untuk transaksi."
          example: "INV-20231025-001"
        totalGross:
          type: number
          description: "Total kotor transaksi sebelum diskon."
          example: 50000
        totalDiscount:
          type: number
          description: "Total diskon yang diberikan pada transaksi."
          example: 5000
        totalNet:
          type: number
          description: "Total bersih transaksi setelah diskon."
          example: 45000
        totalProfit:
          type: number
          description: "Total keuntungan dari transaksi ini."
          example: 10000
        paymentMethod:
          type: string
          description: "Metode pembayaran yang digunakan (misal: CASH, QRIS)."
          example: "CASH"
        memberId:
          type: string
          format: cuid
          nullable: true
          description: "ID member jika transaksi menggunakan member (format CUID)."
          example: "mem123456789"
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED]
          description: "Status transaksi saat ini."
          example: "COMPLETED"
        userId:
          type: string
          format: cuid
          description: "ID user (kasir) yang menangani transaksi (format CUID)."
          example: "user123456789"
        createdAt:
          type: string
          format: date-time
          description: "Waktu transaksi dilakukan."

    Discount:
      type: object
      required: [id, name, type, value, startDate, endDate, isActive]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik diskon dalam format CUID."
          example: "disc123456789"
        name:
          type: string
          description: "Nama program diskon."
          example: "Promo Ramadhan"
        description:
          type: string
          nullable: true
          description: "Deskripsi detail mengenai diskon."
          example: "Diskon khusus bulan Ramadhan."
        type:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          description: "Tipe diskon: persentase atau nominal tetap."
          example: "PERCENTAGE"
        value:
          type: number
          description: "Nilai diskon (persentase atau nominal)."
          example: 10
        startDate:
          type: string
          format: date-time
          description: "Waktu mulai berlakunya diskon."
        endDate:
          type: string
          format: date-time
          description: "Waktu berakhirnya diskon."
        isActive:
          type: boolean
          description: "Status apakah diskon sedang aktif atau tidak."
          example: true
        isTransactionLevel:
          type: boolean
          description: "Apakah diskon berlaku untuk seluruh transaksi."
          example: false
        createdAt:
          type: string
          format: date-time
          description: "Waktu diskon dibuat."
        updatedAt:
          type: string
          format: date-time
          description: "Waktu diskon terakhir diperbarui."

    Member:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik member dalam format CUID."
          example: "mem123456789"
        name:
          type: string
          minLength: 1
          description: "Nama lengkap member."
          example: "Budi Santoso"
        phone:
          type: string
          minLength: 8
          nullable: true
          description: "Nomor telepon member (minimal 8 digit)."
          example: "081234567890"
        points:
          type: integer
          description: "Jumlah poin yang dikumpulkan oleh member."
          example: 150
        createdAt:
          type: string
          format: date-time
          description: "Waktu member terdaftar."

    User:
      type: object
      required: [id, name, username, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik user/staf dalam format CUID."
          example: "user123456789"
        name:
          type: string
          minLength: 1
          maxLength: 20
          description: "Nama lengkap user."
          example: "Andi Wijaya"
        username:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^[a-zA-Z0-9_]{1,20}$"
          description: "Username unik untuk login."
          example: "andi_cashier"
        role:
          type: string
          enum: [ADMIN, SUPERVISOR, CASHIER]
          description: "Peran atau hak akses user dalam sistem."
          example: "CASHIER"
        createdAt:
          type: string
          format: date-time
          description: "Waktu akun user dibuat."
        updatedAt:
          type: string
          format: date-time
          description: "Waktu akun user terakhir diperbarui."

    TransactionItem:
      type: object
      required:
        [id, transactionId, productId, qty, priceAtSale, hppAtSale, subtotal]
      properties:
        id:
          type: string
          format: cuid
          description: "ID unik item transaksi dalam format CUID."
          example: "txi123456789"
        transactionId:
          type: string
          format: cuid
          description: "ID transaksi terkait (format CUID)."
          example: "tx123456789"
        productId:
          type: string
          format: cuid
          description: "ID produk yang terjual (format CUID)."
          example: "prod123456789"
        qty:
          type: integer
          description: "Jumlah unit produk yang terjual."
          example: 2
        priceAtSale:
          type: number
          description: "Harga jual produk pada saat transaksi terjadi."
          example: 25000
        hppAtSale:
          type: number
          description: "Harga pokok penjualan (modal) pada saat transaksi."
          example: 15000
        subtotal:
          type: number
          description: "Subtotal untuk item ini (setelah diskon)."
          example: 50000

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: "Nomor halaman saat ini."
          example: 1
        limit:
          type: integer
          description: "Jumlah data per halaman."
          example: 10
        totalItems:
          type: integer
          description: "Total keseluruhan data yang tersedia."
          example: 150
        totalPages:
          type: integer
          description: "Total keseluruhan halaman yang tersedia."
          example: 15
        hasNextPage:
          type: boolean
          description: "Apakah ada halaman berikutnya."
          example: true
        hasPrevPage:
          type: boolean
          description: "Apakah ada halaman sebelumnya."
          example: false

  responses:
    BadRequest:
      description: Permintaan tidak valid (Bad Request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Tidak terautentikasi (Unauthorized).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Tidak memiliki izin (Forbidden).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Sumber daya tidak ditemukan (Not Found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Kesalahan internal server (Internal Server Error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /api/auth/sign-in/username:
    post:
      tags:
        - Auth
      summary: "Masuk dengan username"
      operationId: signInWithUsername
      description: "Melakukan autentikasi pengguna ke dalam sistem menggunakan kombinasi username dan kata sandi."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: "Username unik akun pengguna."
                  example: "andi_cashier"
                password:
                  type: string
                  format: password
                  description: "Kata sandi akun pengguna."
                  example: "Password123"
      responses:
        "200":
          description: "Berhasil masuk ke sistem."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, user]
                        properties:
                          token:
                            type: string
                            description: "Token autentikasi sesi."
                            example: "cIvDQ09nW7aFVTyE3h79KqPwnfhV6Ddr"
                          user:
                            $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/sign-out:
    post:
      tags:
        - Auth
      summary: "Keluar dari sistem"
      operationId: signOut
      description: "Mengakhiri sesi aktif pengguna dan menghapus token autentikasi dari browser."
      responses:
        "200":
          description: "Berhasil keluar dari sistem."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: "Status keberhasilan operasi."
                    example: true

  /api/auth/get-session:
    get:
      tags:
        - Auth
      summary: "Ambil sesi saat ini"
      operationId: getSession
      description: "Mendapatkan informasi detail mengenai sesi aktif dan data profil pengguna yang sedang masuk."
      responses:
        "200":
          description: "Data sesi berhasil ditemukan."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [userData, user, session]
                        properties:
                          userData:
                            $ref: "#/components/schemas/User"
                          user:
                            $ref: "#/components/schemas/User"
                          session:
                            type: object
                            properties:
                              id:
                                type: string
                                format: cuid
                              token:
                                type: string
                              userId:
                                type: string
                                format: cuid
                              expiresAt:
                                type: string
                                format: date-time
                              createdAt:
                                type: string
                                format: date-time
                              updatedAt:
                                type: string
                                format: date-time
                              ipAddress:
                                type: string
                              userAgent:
                                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products:
    get:
      tags:
        - Products
      summary: "Ambil semua produk"
      operationId: getAllProducts
      description: "Mengambil daftar produk dengan dukungan pencarian, pemfilteran kategori, dan paginasi."
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah data per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman yang ingin diambil."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama produk atau SKU."
        - in: query
          name: categoryId
          schema:
            type: string
            format: cuid
          description: "Filter produk berdasarkan ID kategori (format CUID)."
      responses:
        "200":
          description: "Daftar produk berhasil diambil."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Products
      summary: "Tambah produk baru"
      operationId: createProduct
      description: "Menambahkan produk baru ke dalam inventori toko beserta unggahan gambar."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, sku, hpp, price, stock, categoryId]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  description: "Nama produk."
                  example: "Kopi Susu Gula Aren"
                sku:
                  type: string
                  minLength: 3
                  maxLength: 100
                  description: "Kode SKU produk."
                  example: "KOPI-001"
                hpp:
                  type: number
                  description: "Harga Pokok Penjualan (modal)."
                  example: 15000
                price:
                  type: number
                  description: "Harga jual produk."
                  example: 25000
                stock:
                  type: number
                  description: "Jumlah stok awal."
                  example: 50
                lowStockThreshold:
                  type: number
                  description: "Ambang batas stok rendah."
                  example: 10
                categoryId:
                  type: string
                  format: cuid
                  description: "ID kategori produk (format CUID)."
                  example: "cat123456789"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "File gambar produk (format file)."
      responses:
        "201":
          description: "Produk berhasil ditambahkan."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/alert-low-stock:
    get:
      tags:
        - Products
      summary: "Ambil peringatan stok rendah"
      operationId: alertLowStock
      description: "Mengambil daftar produk yang stoknya sudah mencapai atau berada di bawah ambang batas stok rendah."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Daftar produk stok rendah berhasil diambil."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    get:
      tags:
        - Products
      summary: "Ambil detail produk"
      operationId: getProductById
      description: "Mendapatkan informasi lengkap mengenai sebuah produk berdasarkan ID uniknya."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: cuid
          description: "ID unik produk (format CUID)."
      responses:
        "200":
          description: "Detail produk berhasil ditemukan."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Products
      summary: "Perbarui produk"
      operationId: updateProduct
      description: "Memperbarui data produk yang sudah ada, termasuk informasi harga, stok, dan gambar."
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: cuid
          description: "ID unik produk yang akan diperbarui (format CUID)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  description: "Nama produk baru."
                  example: "Kopi Susu Gula Aren Spesial"
                sku:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "KOPI-001-S"
                hpp:
                  type: number
                  example: 16000
                price:
                  type: number
                  example: 27000
                stock:
                  type: number
                  example: 60
                lowStockThreshold:
                  type: number
                  example: 15
                categoryId:
                  type: string
                  format: cuid
                  description: "ID kategori baru (format CUID)."
                  example: "cat123456789"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "Unggah gambar baru untuk mengganti gambar lama."
      responses:
        "200":
          description: "Produk berhasil diperbarui."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Products
      summary: "Hapus produk"
      operationId: deleteProduct
      description: "Menghapus produk secara permanen dari sistem berdasarkan ID."
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: cuid
          description: "ID unik produk yang akan dihapus (format CUID)."
      responses:
        "200":
          description: "Produk berhasil dihapus."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      tags:
        - Categories
      summary: "Ambil semua kategori"
      operationId: getAllCategories
      description: "Mengambil daftar semua kategori produk dengan dukungan paginasi dan pencarian berdasarkan nama."
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah data per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman yang ingin diambil."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama kategori."
      responses:
        "200":
          description: "Daftar kategori berhasil diambil."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
    post:
      tags:
        - Categories
      summary: "Tambah kategori baru"
      operationId: createCategory
      description: "Membuat kategori produk baru ke dalam sistem."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  description: "Nama kategori baru."
                  example: "Makanan Ringan"
      responses:
        "201":
          description: "Kategori berhasil dibuat."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories/{id}:
    get:
      tags:
        - Categories
      summary: "Ambil detail kategori"
      operationId: getCategoryById
      description: "Mendapatkan informasi lengkap mengenai sebuah kategori berdasarkan ID uniknya."
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: cuid
          description: "ID unik kategori (format CUID)."
      responses:
        "200":
