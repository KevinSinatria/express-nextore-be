openapi: 3.0.0
info:
  title: Nextore API
  description: API Documentation for Nextore Backend
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Development server

tags:
  - name: Auth
    description: Authentication endpoints provided by better-auth
  - name: Products
    description: Product management endpoints
  - name: Categories
    description: Category management endpoints
  - name: Transactions
    description: Transaction management endpoints
  - name: Discounts
    description: Discount management endpoints
  - name: Members
    description: Member management endpoints
  - name: Users
    description: User management endpoints (Admin only)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session-token
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
          description: Menunjukkan apakah permintaan berhasil atau tidak.
        message:
          type: string
          example: "Pesan kesalahan yang menjelaskan apa yang salah"
          description: Pesan deskriptif tentang kesalahan yang terjadi.
    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Input tidak valid"
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Menunjukkan bahwa permintaan berhasil.
        message:
          type: string
          example: "Operasi berhasil dilakukan"
          description: Pesan kesuksesan dari server.
        data:
          type: object
          description: Data hasil operasi (opsional).
        meta:
          type: object
          description: Metadata tambahan seperti pagination (opsional).
  responses:
    BadRequest:
      description: Permintaan tidak valid (Bad Request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Tidak terautentikasi (Unauthorized).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Tidak memiliki izin (Forbidden).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Sumber daya tidak ditemukan (Not Found).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Kesalahan internal server (Internal Server Error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Product:
      type: object
      required: [id, sku, name, hpp, price, stock, categoryId]
      properties:
        id:
          type: string
          description: "ID unik produk dalam format CUID."
          example: "clj1234567890abcdefg"
        sku:
          type: string
          minLength: 3
          maxLength: 100
          description: "Stock Keeping Unit, kode unik pengenal produk."
          example: "PROD-001"
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: "Nama produk."
          example: "Kopi Susu Gula Aren"
        images:
          type: array
          items:
            type: string
            format: uri
          description: "Daftar URL gambar produk."
          example:
            [
              "https://res.cloudinary.com/demo/image/upload/v1234567/product1.jpg",
            ]
        hpp:
          type: number
          description: "Harga Pokok Penjualan (modal)."
          example: 15000
        price:
          type: number
          description: "Harga jual produk."
          example: 25000
        stock:
          type: integer
          description: "Jumlah stok yang tersedia."
          example: 50
        lowStockThreshold:
          type: integer
          description: "Ambang batas stok rendah untuk peringatan."
          example: 10
        categoryId:
          type: string
          description: "ID kategori produk."
          example: "cat123456789"
        createdAt:
          type: string
          format: date-time
          description: "Waktu produk dibuat."
          example: "2023-10-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Waktu produk terakhir diperbarui."
          example: "2023-10-25T15:00:00Z"
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: "ID unik kategori dalam format CUID."
          example: "cat123456789"
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: "Nama kategori."
          example: "Minuman Kota"
        createdAt:
          type: string
          format: date-time
          description: "Waktu kategori dibuat."
          example: "2023-10-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Waktu kategori terakhir diperbarui."
          example: "2023-10-25T15:00:00Z"
    Transaction:
      type: object
      required:
        [
          id,
          invoiceNumber,
          totalGross,
          totalDiscount,
          totalNet,
          totalProfit,
          paymentMethod,
          status,
          userId,
          createdAt,
        ]
      properties:
        id:
          type: string
          description: "ID unik transaksi dalam format CUID."
          example: "tx123456789"
        invoiceNumber:
          type: string
          description: "Nomor invoice unik untuk transaksi."
          example: "INV-20231025-001"
        totalGross:
          type: number
          description: "Total kotor transaksi sebelum diskon."
          example: 50000
        totalDiscount:
          type: number
          description: "Total diskon yang diberikan pada transaksi."
          example: 5000
        totalNet:
          type: number
          description: "Total bersih transaksi setelah diskon."
          example: 45000
        totalProfit:
          type: number
          description: "Total keuntungan dari transaksi ini."
          example: 10000
        paymentMethod:
          type: string
          description: "Metode pembayaran yang digunakan (misal: CASH, QRIS)."
          example: "CASH"
        memberId:
          type: string
          nullable: true
          description: "ID member jika transaksi menggunakan member."
          example: "mem123456789"
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED]
          description: "Status transaksi saat ini."
          example: "COMPLETED"
        userId:
          type: string
          description: "ID user (kasir) yang menangani transaksi."
          example: "user123456789"
        createdAt:
          type: string
          format: date-time
          description: "Waktu transaksi dilakukan."
          example: "2023-10-25T14:30:00Z"
    Discount:
      type: object
      required: [id, name, type, value, startDate, endDate, isActive]
      properties:
        id:
          type: string
          description: "ID unik diskon dalam format CUID."
          example: "disc123456789"
        name:
          type: string
          description: "Nama program diskon."
          example: "Promo Grand Opening"
        description:
          type: string
          nullable: true
          description: "Deskripsi detail mengenai diskon."
          example: "Diskon 10% untuk semua item di hari pembukaan."
        type:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          description: "Tipe diskon: persentase atau nominal tetap."
          example: "PERCENTAGE"
        value:
          type: number
          description: "Nilai diskon (persentase atau nominal)."
          example: 10
        startDate:
          type: string
          format: date-time
          description: "Waktu mulai berlakunya diskon."
          example: "2023-10-01T00:00:00Z"
        endDate:
          type: string
          format: date-time
          description: "Waktu berakhirnya diskon."
          example: "2023-10-31T23:59:59Z"
        isActive:
          type: boolean
          description: "Status apakah diskon sedang aktif atau tidak."
          example: true
        isTransactionLevel:
          type: boolean
          description: "Apakah diskon berlaku untuk seluruh transaksi."
          example: false
        createdAt:
          type: string
          format: date-time
          description: "Waktu diskon dibuat."
          example: "2023-10-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Waktu diskon terakhir diperbarui."
          example: "2023-10-25T15:00:00Z"
    Member:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: "ID unik member dalam format CUID."
          example: "mem123456789"
        name:
          type: string
          minLength: 1
          description: "Nama lengkap member."
          example: "Budi Santoso"
        phone:
          type: string
          minLength: 8
          nullable: true
          description: "Nomor telepon member (minimal 8 digit)."
          example: "081234567890"
        points:
          type: integer
          description: "Jumlah poin yang dikumpulkan oleh member."
          example: 150
        createdAt:
          type: string
          format: date-time
          description: "Waktu member terdaftar."
          example: "2023-10-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Waktu data member terakhir diperbarui."
          example: "2023-10-25T15:00:00Z"
    User:
      type: object
      required: [id, name, username, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: "ID unik user/staf dalam format CUID."
          example: "user123456789"
        name:
          type: string
          minLength: 1
          maxLength: 20
          description: "Nama lengkap user."
          example: "Andi Wijaya"
        username:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^[a-zA-Z0-9_]{1,20}$"
          description: "Username unik untuk login."
          example: "andi_cashier"
        role:
          type: string
          enum: [ADMIN, SUPERVISOR, CASHIER]
          description: "Peran atau hak akses user dalam sistem."
          example: "CASHIER"
        createdAt:
          type: string
          format: date-time
          description: "Waktu akun user dibuat."
          example: "2023-10-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: "Waktu akun user terakhir diperbarui."
          example: "2023-10-25T15:00:00Z"
    TransactionItem:
      type: object
      required:
        [id, transactionId, productId, qty, priceAtSale, hppAtSale, subtotal]
      properties:
        id:
          type: string
          description: "ID unik item transaksi dalam format CUID."
          example: "txi123456789"
        transactionId:
          type: string
          description: "ID transaksi terkait."
          example: "tx123456789"
        productId:
          type: string
          description: "ID produk yang terjual."
          example: "clj1234567890abcdefg"
        qty:
          type: integer
          description: "Jumlah unit produk yang terjual."
          example: 2
        priceAtSale:
          type: number
          description: "Harga jual produk pada saat transaksi terjadi."
          example: 25000
        hppAtSale:
          type: number
          description: "Harga pokok penjualan (modal) pada saat transaksi."
          example: 15000
        totalDiscount:
          type: number
          description: "Total diskon untuk item ini."
          example: 0
        subtotal:
          type: number
          description: "Subtotal untuk item ini (setelah diskon)."
          example: 50000

paths:
  /api/auth/sign-in/username:
    post:
      tags:
        - Auth
      summary: Masuk menggunakan username
      operationId: signInWithUsername
      description: Izinkan pengguna untuk masuk ke sistem menggunakan username dan password mereka.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "andi_cashier"
                password:
                  type: string
                  format: password
                  example: "Password123"
      responses:
        "200":
          description: Berhasil masuk ke sistem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/sign-out:
    post:
      tags:
        - Auth
      summary: Keluar dari sistem
      operationId: signOut
      description: Mengakhiri sesi pengguna saat ini dan menghapus token autentikasi.
      responses:
        "200":
          description: Berhasil keluar dari sistem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/auth/get-session:
    get:
      tags:
        - Auth
      summary: Ambil sesi saat ini
      operationId: getSession
      description: Mengambil informasi sesi dan data pengguna yang sedang login.
      responses:
        "200":
          description: Data sesi dan pengguna ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products:
    get:
      tags:
        - Products
      summary: Ambil semua produk
      operationId: getAllProducts
      description: Mengambil daftar semua produk dengan dukungan pagination, pencarian, dan pemfilteran kategori.
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah item per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama atau SKU."
        - in: query
          name: categoryId
          schema:
            type: string
          description: "Filter berdasarkan ID kategori."
      responses:
        "200":
          description: Daftar produk berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Products
      summary: Tambah produk baru
      operationId: createProduct
      description: Membuat produk baru dengan mengunggah gambar dan detail produk.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, sku, hpp, price, stock, categoryId]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "Kopi Susu Gula Aren"
                sku:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "KOPI-001"
                hpp:
                  type: number
                  example: 15000
                price:
                  type: number
                  example: 25000
                stock:
                  type: number
                  example: 50
                lowStockThreshold:
                  type: number
                  example: 10
                categoryId:
                  type: string
                  example: "cat123456789"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "File gambar produk (maksimal beberapa file)."
      responses:
        "201":
          description: Produk berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products/alert-low-stock:
    get:
      tags:
        - Products
      summary: Ambil produk stok rendah
      operationId: alertLowStock
      description: Mengambil daftar produk yang stoknya sudah mencapai atau di bawah ambang batas stok rendah.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Daftar produk stok rendah berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products/{id}:
    get:
      tags:
        - Products
      summary: Ambil produk berdasarkan ID
      operationId: getProductById
      description: Mengambil informasi detail sebuah produk menggunakan ID uniknya.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID unik produk (CUID)."
      responses:
        "200":
          description: Detail produk berhasil ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Products
      summary: Perbarui produk
      operationId: updateProduct
      description: Memperbarui informasi produk yang sudah ada, termasuk mengganti gambar jika diperlukan.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID unik produk yang akan diperbarui."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "Kopi Susu Gula Aren Spesial"
                sku:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "KOPI-001-S"
                hpp:
                  type: number
                  example: 16000
                price:
                  type: number
                  example: 27000
                stock:
                  type: number
                  example: 60
                lowStockThreshold:
                  type: number
                  example: 15
                categoryId:
                  type: string
                  example: "cat123456789"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "File gambar baru produk (opsional)."
      responses:
        "200":
          description: Produk berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Products
      summary: Hapus produk
      operationId: deleteProduct
      description: Menghapus produk dari sistem berdasarkan ID. Tindakan ini bersifat permanen.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID unik produk yang akan dihapus."
      responses:
        "200":
          description: Produk berhasil dihapus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      tags:
        - Categories
      summary: Ambil semua kategori
      operationId: getAllCategories
      description: Mengambil daftar semua kategori produk dengan dukungan pagination dan pencarian.
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah item per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nama kategori."
      responses:
        "200":
          description: Daftar kategori berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      tags:
        - Categories
      summary: Tambah kategori baru
      operationId: createCategory
      description: Membuat kategori produk baru.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "Makanan Ringan"
      responses:
        "201":
          description: Kategori berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Ambil kategori berdasarkan ID
      operationId: getCategoryById
      description: Mengambil informasi detail sebuah kategori menggunakan ID uniknya.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID unik kategori."
      responses:
        "200":
          description: Detail kategori berhasil ditemukan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Categories
      summary: Perbarui kategori
      operationId: updateCategory
      description: Memperbarui nama kategori yang sudah ada.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID unik kategori yang akan diperbarui."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "Snack & Cemilan"
      responses:
        "200":
          description: Kategori berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Categories
      summary: Hapus kategori
      operationId: deleteCategory
      description: Menghapus kategori dari sistem. Pastikan tidak ada produk yang masih menggunakan kategori ini.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "ID unik kategori yang akan dihapus."
      responses:
        "200":
          description: Kategori berhasil dihapus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions:
    get:
      tags:
        - Transactions
      summary: Ambil semua transaksi
      operationId: getAllTransactions
      description: Mengambil daftar semua transaksi dengan dukungan pagination dan pencarian berdasarkan nomor invoice.
      parameters:
        - in: query
          name: limit
          schema:
            type: string
            default: "10"
          description: "Jumlah item per halaman."
        - in: query
          name: page
          schema:
            type: string
            default: "1"
          description: "Nomor halaman."
        - in: query
          name: search
          schema:
            type: string
          description: "Pencarian berdasarkan nomor invoice."
      responses:
        "200":
          description: Daftar transaksi berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
    post:
      tags:
        - Transactions
      summary: Buat transaksi baru
      operationId: createTransaction
      description: Membuat transaksi penjualan baru dengan daftar item produk.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod, items]
              properties:
                paymentMethod:
                  type: string
                  example: "CASH"
                memberId:
                  type: string
                  example: "mem123456789"
                  description: "ID member jika ada (opsional)."
                status:
                  type: string
                  enum: [PENDING, COMPLETED, CANCELLED]
                  default: PENDING
                  example: "COMPLETED"
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, qty]
                    properties:
                      productId:
                        type: string
                        example: "clj1234567890abcdefg"
                      qty:
                        type: integer
                        example: 2
      responses:
        "201":
          description: Transaksi berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

